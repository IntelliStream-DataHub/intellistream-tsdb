<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:12px;fill:#1f2328}.h{font-size:14px;font-weight:600}.m{font-size:11.5px;fill:#59636e}.n{fill:#1f2328}.v{font-size:11.5px;fill:#59636e}.us .n,.us .v{font-weight:700;fill:#1f2328}.b{fill:#6a9a78}.us .b{fill:#1d5fa8}.r{stroke:#d1d9e0;stroke-width:1}.fail{fill:#ffebe9;stroke:#cf222e;stroke-width:1}.failt{font-size:11px;fill:#82071e}.none{fill:#f6f8fa;stroke:#afb8c1;stroke-width:1}.nonet{font-size:11.5px;font-style:italic;fill:#59636e}</style>
