# tsdbd's settings (docs/config.md lists every key; `tsdbd --config-keys` prints them). Install:
#   install -d /etc/tsdb && install -m 644 tsdbd.properties /etc/tsdb/
# The unit starts tsdbd with --config /etc/tsdb/tsdbd.properties; a change takes effect at the next restart
# (`tsdbd --config /etc/tsdb/tsdbd.properties --check-config` checks the file first). A mistake in this file
# (an unknown key, a bad value) stops the server from starting, with the file and the line in the message.
# The file must not be writable by its group or by others: it decides where data is stored and who may log in.
# Passwords are never written here; the user commands of `tsdb` keep them in USERS.
# Lists are comma-separated. # starts a comment only at the beginning of a line.

storage.dir = /var/lib/tsdb
# On ext4 or XFS, check the data of every read (ZFS checks its own).
storage.verify.checksums = true

# There is no TLS: listen on a trusted interface only.
server.listen = 127.0.0.1
server.port = 7070

# Prometheus metrics on a port of their own (docs/metrics.md); remove the line to leave them off.
#metrics.port = 9170

# Storage that can fail alone (one NFS mount each): a volume under one answers UNAVAILABLE while it is down.
#health.domains = /mnt/nfs1, /mnt/nfs2
