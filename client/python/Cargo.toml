[package]
name = "tsdb-client-python"
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Python binding (PyO3) for the tsdbd client"
publish = false

[lib]
name = "tsdb_client"
crate-type = ["cdylib"]

[dependencies]
tsdb-client = { package = "intellistream-tsdb-client", version = "=0.10.0", path = "../rust" }
tsdb-client-python-common = { path = "../python-common" }
pyo3 = "0.29"
# results handed to numpy without a copy (PyArray from a Vec)
numpy = "0.29"

[features]
# tests only: tsdb_client._set_client_nonce and _pbkdf2_runs (`maturin develop --features test-hooks`, as
# `make test-python` builds it); wheels and sdists are built without it
test-hooks = ["tsdb-client/test-hooks"]
