[package]
name = "tsdb-client-python"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Python binding (PyO3) for the tsdbd client"
publish = false

[lib]
name = "tsdb_client"
crate-type = ["cdylib"]

[dependencies]
tsdb-client = { path = "../rust", features = ["embedded"] }
pyo3 = "0.29"
# results handed to numpy without a copy (PyArray from a Vec)
numpy = "0.29"
