[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "intellistream-tsdb-client"
description = "Client for tsdbd, the TCP server of the tsdb time series database"
requires-python = ">=3.9"
dynamic = ["version"]
license = "Apache-2.0"
# the wheel carries these under .dist-info/licenses/; tsdb's own terms and the notices of the libraries linked in
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES"]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest"]

[tool.maturin]
module-name = "tsdb_client"
features = ["pyo3/extension-module"]
