# Builds the release tarball of a tag and attaches it to the tag's GitHub release (docs/release.md, step 6).
#
#   a pushed tag vX.Y.Z (or vX.Y.Z-rc.N): builds it and releases it
#   by hand: Actions -> release -> Run workflow, tag = vX.Y.Z, for a tag that already exists (a rerun, or a tag
#            pushed before this workflow existed: v0.9.0). "Use workflow from" the tag itself where the tag has this
#            file: only then is the build provenance attested (it names the run's ref and commit, which must be the
#            tag's). From a branch, the run builds and attaches the tag's tarball without an attestation.
#            `replace`: a published release that already has the files gets the new ones (else the run refuses).
#
# Jobs: `tag` checks the tag name; `build` checks out exactly the tag, checks its signature when the default branch
# lists the release signers (.github/release-signers, an ssh allowed_signers file), checks VERSION against it, runs
# make dist, make dist-test, make dist-check-sandybridge (qemu-user from apt) and make dist-check-almalinux10
# (Podman, on the runner image) with read-only rights, and keeps the tarball and its .sha256 as a run artifact;
# `publish` checks the tarball against that .sha256, attests its build provenance, makes or finds the release and
# uploads both files. The release stays a draft when the runner had no AVX-512, so the v4 code was not run: someone
# runs the tarball's suite on an AVX-512 machine and publishes it (docs/release.md, step 6).
#
# Rules this file follows (as ci.yml):
#   - The code is always built from the tag. The scripts and the release text come from the workflow's own checkout
#     (the tag itself on a push; the ref chosen under "Use workflow from" on a manual run): docs/releases/TAG.md at
#     the tag first, then in that checkout, then the tag's CHANGELOG section (tools/release-notes.sh).
#   - No gh: the API is called with curl and the job's GITHUB_TOKEN (.github/scripts/release-publish.sh, tested
#     against a mock of the API by tests/test_release_publish.py). No other secret.
#   - Values from the event (the tag) reach scripts through env:, never written into a run: script, and only after
#     the `tag` job checked them.
#   - Rights: none by default; contents: read to build; contents: write, id-token: write and attestations: write
#     only in `publish`, which builds nothing (no make): it runs the workflow's own scripts, which on a push are
#     the tag's (as this file is), and on a manual run those of the ref it was started from.
#   - Third-party actions are pinned to a full commit SHA with the version in a comment, at least two weeks old.
#   - Who may release is who may push a v* tag: limit that with a tag ruleset (docs/release.md, step 6).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and release, e.g. v0.9.0"
        required: true
        type: string
      replace:
        description: "Replace the files of a release that is already published (their checksum changes)"
        required: false
        type: boolean
        default: false

permissions: {}

# One run per tag at a time; a second run waits rather than cancelling one that may be halfway through an upload.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------------------------------------------ tag
  tag:
    name: check the tag name
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      # "true" when the run's ref is the tag (a push, or a manual run from the tag): the attestation names the ref
      from_tag: ${{ steps.check.outputs.from_tag }}
    steps:
      - name: vX.Y.Z or vX.Y.Z-prerelease, and a push of a tag or a manual run
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          PUSHED: ${{ github.ref_name }}
          GIVEN: ${{ inputs.tag }}
        run: |
          set -eu
          case $EVENT in
          push) [ "$REF_TYPE" = tag ] || { echo "::error::not a tag push"; exit 1; }; tag=$PUSHED ;;
          workflow_dispatch) tag=$GIVEN ;;
          *) echo "::error::unexpected event"; exit 1 ;;
          esac
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::the tag is not vX.Y.Z or vX.Y.Z-prerelease"
              exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release tag: $tag"
          if [ "$REF" = "refs/tags/$tag" ]; then
              echo "from_tag=true" >>"$GITHUB_OUTPUT"
          else
              echo "from_tag=false" >>"$GITHUB_OUTPUT"
              echo "::notice::the run is from $REF, not from the tag: no build provenance attestation" \
                  "(it would name $REF); run it from the tag $tag for one"
          fi

  # ---------------------------------------------------------------------------------------------------- build
  build:
    name: build and test the tarball
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      top_level: ${{ steps.build.outputs.top_level }}
    steps:
      - name: Check out the workflow (its scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wf
          persist-credentials: false
      - name: Check out the tag (the code to build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          path: src
          # every tag, so the build script can see what else points at the commit, and the branches, for the
          # release signers of the default branch
          fetch-depth: 0
          persist-credentials: false
      - name: The release signers, from the default branch (never from the tag)
        working-directory: src
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          f="refs/remotes/origin/$DEFAULT_BRANCH:.github/release-signers"
          if git cat-file -e "$f" 2>/dev/null; then
              git show "$f" >"$RUNNER_TEMP/release-signers"
              echo "RELEASE_SIGNERS=$RUNNER_TEMP/release-signers" >>"$GITHUB_ENV"
              echo "the tag must be signed by a key of .github/release-signers on $DEFAULT_BRANCH"
          else
              echo "::warning::no .github/release-signers on $DEFAULT_BRANCH: the tag's signature is not checked"
          fi
      - name: Install packages (and qemu-user for the emulated Westmere and Sandy Bridge)
        run: |
          wf/.github/scripts/install-deps.sh
          sudo apt-get install -y -q --no-install-recommends qemu-user
          podman --version
      - name: make dist, dist-test, dist-check-sandybridge, dist-check-almalinux10, sha256sum
        id: build
        working-directory: src
        env:
          # A run from the tag (a push, or by hand from the tag) must build the run's commit, which the attestation
          # names; a pushed tag that moved since is refused. From a branch the tag is taken as it is.
          EXPECT_COMMIT: ${{ github.ref == format('refs/tags/{0}', needs.tag.outputs.tag) && github.sha || '' }}
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          ../wf/.github/scripts/release-build.sh "$TAG" ../out 2>&1 | tee ../ci-logs/release-build.log
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Keep the tarball and its checksum for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: out
          if-no-files-found: error
          retention-days: 30
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-release-build
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------------- publish
  publish:
    name: attest and attach to the release
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release, upload its assets
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Check out the workflow (its scripts, docs/releases)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the release text at the tag
          persist-credentials: false
      - name: The tag is still the commit that was built
        run: |
          set -eu
          now=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}") || { echo "::error::no tag $TAG"; exit 1; }
          if [ "$now" != "$COMMIT" ]; then
              echo "::error::the tag $TAG moved from $COMMIT to $now during the run"
              exit 1
          fi
      - name: Fetch the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: out
      - name: Check it against its checksum
        run: |
          set -eu
          version=${TAG#v}
          cd out
          ls -l
          [ "$(ls | sort | tr '\n' ' ')" = "tsdb-$version-x86_64-linux.tar.gz tsdb-$version-x86_64-linux.tar.gz.sha256 " ]
          sha256sum -c "tsdb-$version-x86_64-linux.tar.gz.sha256"
      # The attestation names the run's ref and commit as the source (from the OIDC token), so only a run from the
      # tag gets one; build ran with EXPECT_COMMIT = that commit, and this checks it once more.
      - name: The commit built is the run's
        if: needs.tag.outputs.from_tag == 'true'
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -eu
          [ "$COMMIT" = "$RUN_SHA" ] || { echo "::error::built $COMMIT, but the run is $RUN_SHA"; exit 1; }
      - name: Attest the build provenance of the tarball
        if: needs.tag.outputs.from_tag == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Release text
        run: tools/release-notes.sh "$TAG" "refs/tags/$TAG" >"$RUNNER_TEMP/notes.md"
      - name: Create or find the release, upload the tarball and its checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          REPLACE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace && '1' || '0' }}
          # the v4 (AVX-512) code ran only on a runner with AVX-512; else a person runs it and publishes the draft
          KEEP_DRAFT: ${{ needs.build.outputs.top_level != 'v4' && '1' || '0' }}
        run: |
          set -eu
          version=${TAG#v}
          .github/scripts/release-publish.sh "$TAG" "$RUNNER_TEMP/notes.md" \
              "out/tsdb-$version-x86_64-linux.tar.gz" "out/tsdb-$version-x86_64-linux.tar.gz.sha256"
