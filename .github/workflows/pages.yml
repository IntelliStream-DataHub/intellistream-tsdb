# Publishes site/ (the landing page and the documentation) to GitHub Pages, from the branch gh-pages: the workflow
# writes site/ to that branch's root (one commit, force-pushed, so the branch stays small and never grows a history).
# Needs, once: Settings -> Pages -> Source: Deploy from a branch, Branch: gh-pages, Folder: / (root).
# Run it by hand once (Actions -> pages -> Run workflow) so the branch exists before it is picked there.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One publication at a time; a newer push waits rather than cancelling one that is halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the site
        run: python3 tests/check_site.py
      - name: Publish site/ to the root of gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          out=$(mktemp -d)
          cp -r site/. "$out/"
          touch "$out/.nojekyll"   # serve the files as they are, without Jekyll
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
