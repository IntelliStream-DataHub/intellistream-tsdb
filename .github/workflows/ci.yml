# Continuous integration for tsdb. What runs where is described in CONTRIBUTING.md ("CI").
#
#   every push to main and every pull request: build-test, asan, tsan, clients, portable, integration, dco (pull requests)
#   jepsen (about 25 minutes of fault injection per event loop) on every push and pull request too, and once a week
#   (every run 5 minutes long, not measured: its limit is the 6 hours a job may have)
#   integration-mutants (the integration suite against 23 planted bugs, about 40 minutes): once a week and on demand
#
# Rules this file follows:
#   - Jobs run directly on ubuntu-24.04 runners (4 CPUs, 16 GB), never in container jobs. Packages come from apt.
#   - Containers are Podman only. No job needs one: `make dist-check-almalinux10` (the tarball in an
#     AlmaLinux 10 container, run with Podman) is left out of CI on purpose; run it by hand before a release.
#   - Third-party actions are pinned to a full commit SHA with the version in a comment, and are at least two weeks
#     old when pinned.
#   - The test harnesses start tsdbd with `--port 0 --port-file`, so no job picks a TCP port.
#   - make is run with -j only for plain builds; the test recipes themselves run one test after the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1" # Mondays, 03:23 UTC: the weekly jepsen run

permissions:
  contents: read

# A new push to the same branch or pull request replaces the run in progress. The event is part of the key so that
# the weekly run and a manual run are not cancelled by a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing make is not hidden by `| tee`

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  # ------------------------------------------------------------------------------------------------ build and test
  build-test:
    # `make test` as five runners: its own lines (units) and the groups after them in four (Makefile: TEST_GROUPS,
    # BT_GROUPS_N, test-groups-1..4), which a single job did not finish in 45 minutes on c2e0eeae. Each is built and run with -j,
    # as `make test` is. Limits: 1.5 x the time measured on 4 CPUs (REPORT of the track ci-time), the units' an estimate.
    name: build and test (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: units, goals: "test TEST_GROUPS=", timeout: 45 }
          - { name: groups 1, goals: "test-groups-1", timeout: 60 }
          - { name: groups 2, goals: "test-groups-2", timeout: 50 }
          - { name: groups 3, goals: "test-groups-3", timeout: 95 }
          - { name: groups 4, goals: "test-groups-4", timeout: 80 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Build
        run: make -j"$(nproc)"
      - name: Which event loops can the server tests use?
        id: io
        # `make test` runs the server tests on io_uring and on epoll. Where io_uring is disabled (a kernel or a policy
        # that refuses it, as on AlmaLinux 10) that would fail on setup, so the job falls back to
        # `make test IO=epoll` and says so in a warning.
        run: echo "list=$(.github/scripts/pick-io.sh)" >> "$GITHUB_OUTPUT"
      - name: make ${{ matrix.goals }} (unit, crash-recovery, fuzz corpus replay, quick start, server on ${{ steps.io.outputs.list }})
        env:
          IO_LIST: ${{ steps.io.outputs.list }}
          GOALS: ${{ matrix.goals }}
        run: |
          ulimit -n 65536 || true
          mkdir -p ci-logs
          # test_cli_users runs the root cases (tests/test_cli_root.sh) as root or in `podman unshare`. Where the
          # runner can do the latter they are required (a skip would fail the job); where it cannot, say so.
          if podman unshare true 2>/dev/null; then
              export TSDB_REQUIRE_ROOT_CASES=1
          else
              echo "::warning::podman unshare does not work on this runner: test_cli_users skips the root cases"
          fi
          make -j"$(nproc)" $GOALS IO="$IO_LIST" 2>&1 | tee ci-logs/make-test.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build-test-${{ matrix.name }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------------------- asan
  asan:
    # `make test` as runners of its own: its groups (the Makefile, "The rest of `make test` as groups") are the matrix.
    # One job for the lot had no room to grow. Each limit is 1.5 x the time of that group on 4 CPUs (a loop of planted
    # bugs runs 2 mutants at a time there, as tools/mutants.sh does on 4 CPUs), 30 minutes at least.
    # tests/check_ci_groups.sh (in `make test`) fails when a group is missing.
    name: AddressSanitizer and UBSan (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: units, target: test, timeout: 45 }
          - { name: units c intents, target: test-units-c, timeout: 30 }
          - { name: units d snapshot, target: test-units-d, timeout: 30 }
          - { name: units e drops, target: test-units-e, timeout: 30 }
          - { name: units f drops mutants, target: test-units-f, timeout: 30 }
          - { name: units g replica, target: test-units-g, timeout: 30 }
          - { name: units h1 replica mutants 1, target: test-units-h1, timeout: 30 }
          - { name: units h2 replica mutants 2, target: test-units-h2, timeout: 30 }
          - { name: units h3 replica mutants 3, target: test-units-h3, timeout: 55 }
          - { name: units h4 replica mutants 4, target: test-units-h4, timeout: 55 }
          - { name: units h5 replica mutants 5, target: test-units-h5, timeout: 45 }
          - { name: units i the rest, target: test-units-i, timeout: 30 }
          - { name: units 2, target: test-units-b, timeout: 40 }
          - { name: units 2b, target: test-units-b2, timeout: 30 }
          - { name: units 2c, target: test-units-b3, timeout: 30 }
          - { name: units 2d, target: test-units-b4, timeout: 30 }
          - { name: units 2e, target: test-units-b5, timeout: 30 }
          - { name: units 2f, target: test-units-b6, timeout: 30 }
          - { name: units 2g, target: test-units-b7, timeout: 30 }
          - { name: units 2h, target: test-units-b8, timeout: 30 }
          - { name: units 2i, target: test-units-b9, timeout: 30 }
          - { name: meta simulator 1, target: test-meta-1, timeout: 30 }
          - { name: meta simulator 2, target: test-meta-2, timeout: 30 }
          - { name: cluster 1, target: test-cluster-1, timeout: 30 }
          - { name: cluster 2, target: test-cluster-2, timeout: 30 }
          - { name: cluster 3, target: test-cluster-3, timeout: 40 }
          - { name: cluster 4, target: test-cluster-4, timeout: 40 }
          - { name: links, target: test-links, timeout: 30 }
          - { name: meta mutants 1, target: test-meta-mutants-1, timeout: 30 }
          - { name: meta mutants 2, target: test-meta-mutants-2, timeout: 30 }
          - { name: server on io_uring, target: test-net, io: uring, timeout: 30 }
          - { name: server on epoll, target: test-net, io: epoll, timeout: 30 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Let the sanitizer map its shadow memory
        # Ubuntu 24.04's kernel randomizes mappings over 32 bits, which the sanitizer runtimes cannot place their
        # shadow memory around ("unexpected memory mapping"). 28 bits is the value they were tested with.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Which event loops can the server tests use?
        id: io
        run: echo "list=$(.github/scripts/pick-io.sh)" >> "$GITHUB_OUTPUT"
      - name: make asan ${{ matrix.target }} (starts with make clean, which is fine in its own job)
        env:
          IO_LIST: ${{ steps.io.outputs.list }}
          TARGET: ${{ matrix.target }}
          IO_ONLY: ${{ matrix.io }}
        run: |
          ulimit -n 65536 || true
          io="$IO_LIST"
          if [ -n "$IO_ONLY" ]; then
              case " $IO_LIST " in
              *" $IO_ONLY "*) io="$IO_ONLY" ;;
              *) echo "::warning::$IO_ONLY is not available on this runner: this group is skipped"; exit 0 ;;
              esac
          fi
          mkdir -p ci-logs
          make asan TEST_TARGET="$TARGET" TEST_GROUPS= IO="$io" 2>&1 | tee ci-logs/make-asan.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-asan-${{ matrix.target }}-${{ matrix.io }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------------------- tsan
  tsan:
    # The groups of `make test`, as in the asan job, with TSan's own limits: 8 to 91 minutes a group on 4 CPUs (the
    # test_drops mutants of e/f take the longest; h3..h5 and 2e/2h/2i split the test_replica and test_ecapply mutants);
    # the 5400 s of a mutant (TSAN_MUT_TIMEOUT) is a limit of the Makefile, the job's the matrix's.
    name: ThreadSanitizer (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: units, target: test, timeout: 55 }
          - { name: units c intents, target: test-units-c, timeout: 85 }
          - { name: units d snapshot, target: test-units-d, timeout: 105 }
          - { name: units e drops, target: test-units-e, timeout: 130 }
          - { name: units f drops mutants, target: test-units-f, timeout: 140 }
          - { name: units g replica, target: test-units-g, timeout: 60 }
          - { name: units h1 replica mutants 1, target: test-units-h1, timeout: 70 }
          - { name: units h2 replica mutants 2, target: test-units-h2, timeout: 40 }
          - { name: units h3 replica mutants 3, target: test-units-h3, timeout: 105 }
          - { name: units h4 replica mutants 4, target: test-units-h4, timeout: 105 }
          - { name: units h5 replica mutants 5, target: test-units-h5, timeout: 85 }
          - { name: units i the rest, target: test-units-i, timeout: 30 }
          - { name: units 2, target: test-units-b, timeout: 60 }
          - { name: units 2b, target: test-units-b2, timeout: 75 }
          - { name: units 2c, target: test-units-b3, timeout: 105 }
          - { name: units 2d, target: test-units-b4, timeout: 30 }
          - { name: units 2e, target: test-units-b5, timeout: 100 }
          - { name: units 2f, target: test-units-b6, timeout: 35 }
          - { name: units 2g, target: test-units-b7, timeout: 30 }
          - { name: units 2h, target: test-units-b8, timeout: 90 }
          - { name: units 2i, target: test-units-b9, timeout: 90 }
          - { name: meta simulator 1, target: test-meta-1, timeout: 30 }
          - { name: meta simulator 2, target: test-meta-2, timeout: 30 }
          - { name: cluster 1, target: test-cluster-1, timeout: 30 }
          - { name: cluster 2, target: test-cluster-2, timeout: 30 }
          - { name: cluster 3, target: test-cluster-3, timeout: 40 }
          - { name: cluster 4, target: test-cluster-4, timeout: 40 }
          - { name: links, target: test-links, timeout: 30 }
          - { name: meta mutants 1, target: test-meta-mutants-1, timeout: 65 }
          - { name: meta mutants 2, target: test-meta-mutants-2, timeout: 65 }
          - { name: server on io_uring, target: test-net, io: uring, timeout: 30 }
          - { name: server on epoll, target: test-net, io: epoll, timeout: 30 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Let the sanitizer map its shadow memory
        run: sudo sysctl -w vm.mmap_rnd_bits=28 # see the asan job
      - name: Which event loops can the server tests use?
        id: io
        run: echo "list=$(.github/scripts/pick-io.sh)" >> "$GITHUB_OUTPUT"
      - name: make tsan ${{ matrix.target }} (builds into build-tsan/, the server under test included)
        env:
          IO_LIST: ${{ steps.io.outputs.list }}
          TARGET: ${{ matrix.target }}
          IO_ONLY: ${{ matrix.io }}
        run: |
          ulimit -n 65536 || true
          io="$IO_LIST"
          if [ -n "$IO_ONLY" ]; then
              case " $IO_LIST " in
              *" $IO_ONLY "*) io="$IO_ONLY" ;;
              *) echo "::warning::$IO_ONLY is not available on this runner: this group is skipped"; exit 0 ;;
              esac
          fi
          mkdir -p ci-logs
          make tsan TEST_TARGET="$TARGET" TEST_GROUPS= IO="$io" 2>&1 | tee ci-logs/make-tsan.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-tsan-${{ matrix.target }}-${{ matrix.io }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------------------------------- clients
  clients:
    name: Rust, Python and Java clients
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh clients
      - name: Rust
        # The crates need Rust 1.88 or newer (edition 2024); the stable toolchain is newer.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Java (the embedded binding needs 22 or newer; the TCP client targets 17)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('client/*/Cargo.lock', 'tests/integration/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('client/python/pyproject.toml', 'client/python-embedded/pyproject.toml', 'Makefile') }}
          restore-keys: pip-${{ runner.os }}-
      - name: make test-clients (Rust, Python, the Python sdist, Java, embedded Java; against build/tsdbd)
        run: |
          mkdir -p ci-logs
          make -j"$(nproc)" test-clients 2>&1 | tee ci-logs/make-test-clients.log
      - name: make test-clients-epoll (Rust, Python, Java against tsdbd on epoll, the backend of AlmaLinux 10)
        run: |
          mkdir -p ci-logs
          make test-clients-epoll 2>&1 | tee ci-logs/make-test-clients-epoll.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-clients
          path: |
            ci-logs
            client/java/target/surefire-reports
            client/java-embedded/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------- portable
  portable:
    name: portable build and tarball
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: make PORTABLE=1 (no -march=native)
        run: make -j"$(nproc)" PORTABLE=1
      - name: make dist (x86-64-v2 plus v3 and v4 codecs; checks the glibc ceiling and the instruction sets)
        run: |
          mkdir -p ci-logs
          make -j"$(nproc)" dist 2>&1 | tee ci-logs/make-dist.log
      - name: make dist-test (the tarball's own tests, at every CPU level this runner has)
        # A level the CPU lacks (v4 without AVX-512) is skipped by the suite itself. The AlmaLinux 10 container check
        # (make dist-check-almalinux10) needs Podman and is not part of CI.
        run: |
          ulimit -n 65536 || true
          make dist-test 2>&1 | tee ci-logs/make-dist-test.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-portable
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------------- integration
  integration:
    name: integration tests and version check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh clients
      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('client/*/Cargo.lock', 'tests/integration/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('client/python/pyproject.toml', 'client/python-embedded/pyproject.toml', 'Makefile') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Build, then check that VERSION, tsdb.h, the binaries and the client manifests agree
        run: |
          make -j"$(nproc)"
          make check-version
      - name: The harness's own tests
        run: make integration-selftest
      - name: make integration-tests (tsdbd, the CLI and the C, Rust, Python and Java clients, uring and epoll)
        # tests/integration/run.py probes io_uring itself and skips the uring runs, with a line in its summary, on a
        # runner that does not offer it.
        run: |
          ulimit -n 65536 || true
          mkdir -p ci-logs
          make integration-tests 2>&1 | tee ci-logs/make-integration-tests.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-integration
          path: |
            ci-logs
            build/integ/logs
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------ integration mutants
  # Does the integration suite have teeth? Each of the 23 planted bugs (tests/integration/mutate.py) is built into a
  # copy of the tree and the scenario that should notice it must fail. About 40 minutes, so once a week and on demand.
  integration-mutants:
    name: integration suite planted bugs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh clients
      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: make integration-mutants
        run: |
          ulimit -n 65536 || true
          mkdir -p ci-logs
          set -o pipefail
          make -j"$(nproc)" build/tsdbd build/tsdb
          make integration-mutants MUTATE_ARGS="--logs $PWD/ci-logs/mutants" 2>&1 | tee ci-logs/make-integration-mutants.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-integration-mutants
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------------------------ upgrade
  # 0.9.0 itself must refuse a database `tsdb upgrade` made (format 9), naming both versions: test_upgrade runs the
  # CLI built from the v0.9.0 tag. Weekly, not per push (a second build of the tree); a missing binary is a failure
  # there (TSDB_REQUIRE_V090_CLI), where a local run prints SKIPPED.
  upgrade-v090:
    name: 0.9.0 refuses an upgraded database
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Build the 0.9.0 CLI from its tag
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/tsdb-v090"
          git archive v0.9.0 | tar -x -C "$RUNNER_TEMP/tsdb-v090"
          make -C "$RUNNER_TEMP/tsdb-v090" -j"$(nproc)" build/tsdb
          "$RUNNER_TEMP/tsdb-v090/build/tsdb" --version | grep -q 'tsdb 0.9.0'
      - name: test_upgrade with it
        run: |
          set -o pipefail
          mkdir -p ci-logs
          make -j"$(nproc)" build/test_upgrade
          TSDB_V090_CLI="$RUNNER_TEMP/tsdb-v090/build/tsdb" TSDB_REQUIRE_V090_CLI=1 \
              build/test_upgrade "$RUNNER_TEMP" 2>&1 | tee ci-logs/test-upgrade-v090.log
          grep -q 'the 0.9.0 binary refuses an upgraded database' ci-logs/test-upgrade-v090.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-upgrade-v090
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # 0.10.1 (format 9) must refuse a format-10 database whose WAL ends in a columnar record, by a writer's open that
  # would otherwise cut that record as a torn tail, and leave every byte; and, as the control, cut it when META says 9.
  # Weekly, as upgrade-v090; a missing binary is a failure there (TSDB_REQUIRE_V010_CLI).
  upgrade-v010:
    name: 0.10.1 refuses a format-10 database
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Build the 0.10.1 CLI from its tag
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/tsdb-v010"
          git archive v0.10.1 | tar -x -C "$RUNNER_TEMP/tsdb-v010"
          make -C "$RUNNER_TEMP/tsdb-v010" -j"$(nproc)" build/tsdb
          "$RUNNER_TEMP/tsdb-v010/build/tsdb" --version | grep -q 'tsdb 0.10.1'
      - name: test_upgrade with it
        run: |
          set -o pipefail
          mkdir -p ci-logs
          make -j"$(nproc)" build/test_upgrade build/tsdb build/libcrashfs.so
          TSDB_V010_CLI="$RUNNER_TEMP/tsdb-v010/build/tsdb" TSDB_REQUIRE_V010_CLI=1 \
              build/test_upgrade "$RUNNER_TEMP" 2>&1 | tee ci-logs/test-upgrade-v010.log
          grep -q 'the 0.10.1 binary refuses a format-10 database' ci-logs/test-upgrade-v010.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-upgrade-v010
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------------------------ jepsen
  jepsen:
    name: jepsen fault injection (${{ matrix.name }})
    # The selftest in five parts and the runs of each event loop, as runners of their own (one job took 145 minutes on 4
    # CPUs: 97 of them the selftest). On every push and pull request: about 25 minutes (a loop) of kill -9, simulated power loss (the crashfs LD_PRELOAD shim,
    # built by make), I/O errors, pauses, misdirected I/O and damage at rest, on both event loops and the workloads kv
    # and classes. Once a week the same with every run 5 minutes long (one power seed, six outage seeds): not measured on 4 CPUs, the limit is 6 hours.
    if: >-
      github.event_name != 'schedule' ||
      github.repository == 'IntelliStream-DataHub/intellistream-tsdb'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && matrix.timeout_weekly || matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: selftest 1, target: jepsen-selftest-1, timeout: 40, timeout_weekly: 40 }
          - { name: selftest 2, target: jepsen-selftest-2, timeout: 60, timeout_weekly: 60 }
          - { name: selftest 3, target: jepsen-selftest-3, timeout: 30, timeout_weekly: 30 }
          - { name: selftest 4, target: jepsen-selftest-4, timeout: 40, timeout_weekly: 40 }
          - { name: selftest 5, target: jepsen-selftest-5, timeout: 30, timeout_weekly: 30 }
          - { name: runs on io_uring, target: jepsen-run, io: uring, timeout: 40, timeout_weekly: 360 }
          - { name: runs on epoll, target: jepsen-run, io: epoll, timeout: 40, timeout_weekly: 360 }
    env:
      JEPSEN_DIR: /tmp/tsdb-jepsen-ci
      JEPSEN_SECONDS: ${{ github.event_name == 'schedule' && '300' || '' }}
      JEPSEN_SEEDS: ${{ github.event_name == 'schedule' && '1' || '1 2 3' }}
      JEPSEN_OUTAGE_SEEDS: ${{ github.event_name == 'schedule' && '1 2 3 4 5 6' || '1 2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .github/scripts/install-deps.sh
      - name: Which event loops can the server use?
        id: io
        run: echo "list=$(.github/scripts/pick-io.sh)" >> "$GITHUB_OUTPUT"
      - name: make ${{ matrix.target }} (${{ matrix.name }})
        env:
          IO_LIST: ${{ steps.io.outputs.list }}
          TARGET: ${{ matrix.target }}
          IO_ONLY: ${{ matrix.io }}
        run: |
          ulimit -n 65536 || true
          io="$IO_LIST"
          if [ -n "$IO_ONLY" ]; then
              case " $IO_LIST " in
              *" $IO_ONLY "*) io="$IO_ONLY" ;;
              *) echo "::warning::$IO_ONLY is not available on this runner: this part is skipped"; exit 0 ;;
              esac
          fi
          mkdir -p ci-logs
          make "$TARGET" IO="$io" JEPSEN_DIR="$JEPSEN_DIR" 2>&1 | tee ci-logs/make-jepsen.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-jepsen-${{ matrix.target }}-${{ matrix.io }}
          path: |
            ci-logs
            /tmp/tsdb-jepsen-ci*.log
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------------- dco
  dco:
    name: DCO sign-off and commit rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so that base..head can be listed
      - name: Check every commit of the pull request
        # .githooks/commit-msg (no session link, a Signed-off-by as the last trailer) plus: that Signed-off-by is the
        # commit author's. The pull request's title and text are checked for a session link too. They are passed in
        # the environment, never put into the script text.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_TEXT="$PR_TITLE
          $PR_BODY"
          export PR_TEXT
          .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
